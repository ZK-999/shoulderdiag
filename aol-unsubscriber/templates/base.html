<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AOL Unsubscriber</title>
<style>
  body { font: 15px/1.4 system-ui, "Segoe UI", sans-serif; margin: 24px auto; max-width: 1100px; padding: 0 16px; color: #222; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 24px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #ddd; vertical-align: top; }
  th { background: #f4f4f4; }
  td.num { text-align: right; }
  .tag { padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #eee; white-space: nowrap; }
  .One-click { background: #d7f0dc; } .Mailto { background: #d9e6fb; } .Link { background: #fdebc8; }
  .success { background: #d7f0dc; } .failed { background: #f9d6d6; } .manual { background: #fdebc8; }
  .dry-run { background: #e4e4f5; } .skipped { background: #eee; }
  .bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #ccc; padding: 12px 0; display: flex; gap: 20px; align-items: center; }
  button { font-size: 15px; padding: 8px 18px; cursor: pointer; }
  .muted { color: #777; } .banner { background: #fff6d6; padding: 8px 12px; border-radius: 6px; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
